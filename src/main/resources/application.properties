spring.application.name=thindesk
# Variáveis locais lidas do arquivo .env na raiz do projeto, quando existir
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.error.include-message=always

# Configurando a conexão com MongoDB enquanto repositório de dados
# A string de conexão vem da variável de ambiente MONGODB_URI (ex.: MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Datas no formato ISO na API (ex.: 2026-11-25T10:15:30)
spring.jackson.serialization.write-dates-as-timestamps=false

# Usuário de demonstração e carga inicial de dados
thindesk.demo.username=${DEMO_USERNAME:demo}
thindesk.demo.password=${DEMO_PASSWORD:demo123}
thindesk.carga-inicial=${SEED_DEMO_DATA:true}

logging.level.com.pfc=INFO
