<div class="container mt-4" th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4">
        <h1 class="mb-0">Clientes</h1>
        <a th:href="@{/clientes/novo}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Novo cliente
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle mt-3">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Setor</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td>
                </tr>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.nome}"></td>
                    <td th:text="${cliente.telefone}"></td>
                    <td th:text="${cliente.setor}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{'/clientes/editar/' + ${cliente.id}}" class="btn btn-warning btn-sm">Editar</a>
                        <form th:action="@{'/clientes/deletar/' + ${cliente.id}}" method="post" class="d-inline"
                              data-confirm="Deseja excluir este cliente?">
                            <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
