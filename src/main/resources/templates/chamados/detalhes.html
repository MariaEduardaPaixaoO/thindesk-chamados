<div class="container mt-4" th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
        <div>
            <h2 class="mb-1" th:text="${chamado.titulo}">Título</h2>
            <span class="badge" th:classappend="'text-bg-' + ${chamado.status?.cor}" th:text="${chamado.status?.descricao}"></span>
        </div>
        <div class="d-flex gap-2">
            <th:block th:unless="${chamado.encerrado}">
                <a th:href="@{/chamados/atualizar/{id}(id=${chamado.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Editar
                </a>
                <form th:action="@{/chamados/cancelar/{id}(id=${chamado.id})}" method="post"
                      data-confirm="Deseja cancelar este chamado?">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-x-circle"></i> Cancelar</button>
                </form>
            </th:block>
            <a th:href="@{/chamados}" class="btn btn-outline-secondary">Voltar</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Descrição</h5>
                    <p class="texto-multilinha mb-0" th:text="${chamado.descricao}"></p>
                </div>
            </div>
            <div class="card shadow-sm mt-3" th:if="${chamado.solucao != null}">
                <div class="card-body">
                    <h5 class="card-title">Solução</h5>
                    <p class="texto-multilinha mb-0" th:text="${chamado.solucao}"></p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <dl class="mb-0">
                        <dt>Tipo</dt>
                        <dd th:text="${chamado.tipo}"></dd>
                        <dt>Solicitante</dt>
                        <dd th:text="${chamado.usuario}"></dd>
                        <dt>Técnico responsável</dt>
                        <dd th:text="${chamado.tecnico} ?: 'Não atribuído'"></dd>
                        <dt>Aberto por</dt>
                        <dd th:text="${chamado.abertoPor} ?: '—'"></dd>
                        <dt>Abertura</dt>
                        <dd th:text="${chamado.dataAbertura != null} ? ${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')} : '—'"></dd>
                        <dt>Última atualização</dt>
                        <dd th:text="${chamado.dataAtualizacao != null} ? ${#temporals.format(chamado.dataAtualizacao, 'dd/MM/yyyy HH:mm')} : '—'"></dd>
                        <th:block th:if="${chamado.dataConclusao != null}">
                            <dt>Encerramento</dt>
                            <dd class="mb-0" th:text="${#temporals.format(chamado.dataConclusao, 'dd/MM/yyyy HH:mm')}"></dd>
                        </th:block>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</div>
