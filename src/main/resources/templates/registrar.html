<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cadastro | Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 1rem;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="text-center">
                <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
                <h3 class="mb-4">Criar conta</h3>
            </div>

            <form th:action="@{/registrar}" th:object="${cadastro}" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" required maxlength="100">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:text="${#fields.errors('nome')[0]}"></div>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid"
                           required minlength="3" maxlength="30" placeholder="Ex.: maria.santos">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:text="${#fields.errors('username')[0]}"></div>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" th:field="*{senha}" class="form-control" th:errorclass="is-invalid"
                           required minlength="6" maxlength="60">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:text="${#fields.errors('senha')[0]}"></div>
                </div>
                <div class="mb-3">
                    <label for="confirmacaoSenha" class="form-label">Confirmar senha</label>
                    <input type="password" th:field="*{confirmacaoSenha}" class="form-control" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:text="${#fields.errors('confirmacaoSenha')[0]}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <div class="mt-3 text-center">
                Já tem conta? <a th:href="@{/login}" class="text-decoration-none">Entrar</a>
            </div>
        </div>
    </div>
</body>
</html>
