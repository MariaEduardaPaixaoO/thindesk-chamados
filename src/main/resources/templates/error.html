<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erro ao carregar a página</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h1 class="h4 mb-1">Erro <span th:text="${status}"></span></h1>
                    <p class="text-muted mb-0" th:text="${#strings.isEmpty(message)} ? ${error} : ${message}"></p>
                </div>
                <a th:href="@{/}" class="btn btn-primary">Voltar ao início</a>
            </div>

            <div style="position: relative; width: 100%; height: 0; padding-top: 56.2225%;
                 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
                 border-radius: 8px; will-change: transform;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
                        src="https://www.canva.com/design/DAGZFzqWqTU/s4fm9bg30dUDGqLvvaWmIg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen" >
                </iframe>
            </div>
        </div>
    </body>
</html>
