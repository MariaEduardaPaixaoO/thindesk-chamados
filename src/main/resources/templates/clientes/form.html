<div class="container mt-4" th:fragment="content">
    <h2 class="mb-4" th:text="${tituloFormulario}">Cliente</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{${acao}}" th:object="${cliente}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid" required maxlength="100">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:text="${#fields.errors('nome')[0]}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" th:field="*{telefone}" class="form-control" th:errorclass="is-invalid"
                               required maxlength="20" placeholder="(11) 98765-4321">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:text="${#fields.errors('telefone')[0]}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="setor" class="form-label">Setor</label>
                        <input type="text" th:field="*{setor}" class="form-control" th:errorclass="is-invalid" required maxlength="60">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('setor')}" th:text="${#fields.errors('setor')[0]}"></div>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
